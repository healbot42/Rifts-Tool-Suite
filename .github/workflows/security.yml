name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '31 9 * * 1'

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: warhammer-deal-bot/requirements.lock
      - name: Install audit tool
        run: python -m pip install pip-audit==2.10.0
      - name: Scan repository for common secrets
        run: python scripts/check-secrets.py
      - name: Audit locked Python dependencies
        run:
          python -m pip_audit --requirement warhammer-deal-bot/requirements.lock
