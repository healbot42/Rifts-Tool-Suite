name: Warhammer Deal Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '17 0,6,12,18 * * *'

permissions:
  contents: read

concurrency:
  group: warhammer-deal-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEAL_BOT_EMAIL_FROM: ${{ secrets.DEAL_BOT_EMAIL_FROM }}
      DEAL_BOT_EMAIL_TO: ${{ secrets.DEAL_BOT_EMAIL_TO }}
      GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
      GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
      GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      DATA_API_TOKEN: ${{ secrets.DATA_API_TOKEN }}
      DATA_API_URL: https://rifts-data-api.zhawkins42.workers.dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: warhammer-deal-bot/requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r warhammer-deal-bot/requirements.lock
          python -m pip install --no-deps -e ./warhammer-deal-bot

      - name: Restore deal history
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: warhammer-deal-bot/data
          key: deal-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            deal-state-

      - name: Prepare runtime configuration
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          import yaml

          source = Path("warhammer-deal-bot/config.example.yaml")
          destination = Path("warhammer-deal-bot/config.actions.yaml")
          config = yaml.safe_load(source.read_text(encoding="utf-8"))
          config["email"]["enabled"] = True
          ebay_enabled = bool(os.environ.get("EBAY_CLIENT_ID")) and bool(
              os.environ.get("EBAY_CLIENT_SECRET")
          )
          config["sources"]["ebay"]["enabled"] = ebay_enabled
          if not ebay_enabled:
              config["sources"]["ebay"]["reason"] = (
                  "Production API approval and credentials are pending"
              )
          destination.write_text(yaml.safe_dump(config, sort_keys=False), encoding="utf-8")
          PY

      - name: Scan for deals
        working-directory: warhammer-deal-bot
        run: python -m warhammer_deal_bot --config config.actions.yaml run

      - name: Save deal history
        if: success()
        uses: actions/cache/save@v4
        with:
          path: warhammer-deal-bot/data
          key: ${{ steps.restore-state.outputs.cache-primary-key }}
