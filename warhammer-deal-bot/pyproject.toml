[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "warhammer-deal-bot"
version = "0.1.0"
description = "Conservative, configuration-driven Warhammer listing monitor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "google-auth>=2.40,<3",
  "google-auth-oauthlib>=1.2,<2",
  "httpx>=0.28,<1",
  "keyring>=25,<26; sys_platform == 'win32'",
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3",
  "tenacity>=9.0,<10",
  "typing-extensions>=4.15,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff==0.16.6"]

[project.scripts]
warhammer-deal-bot = "warhammer_deal_bot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/warhammer_deal_bot"]

[tool.pytest.ini_options]
testpaths = ["../tests/warhammer-deal-bot"]

[tool.ruff]
extend-exclude = [".pytest-tmp*"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
