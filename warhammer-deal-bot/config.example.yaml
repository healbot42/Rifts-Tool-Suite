    queries: ['Sicaran Battle Tank Horus Heresy']
    quantity_wanted: 2
    msrp: 80
    hard_threshold: 60
    percent_off_threshold: 25
    minimum_savings: 15
    excluded_terms: [Omega, Venator, Arcus, Punisher]
  - id: predator
    name: Horus Heresy Predator Battle Tank
    aliases: [Predator Battle Tank, Deimos Pattern Predator]
    queries: ['Horus Heresy Predator Battle Tank', 'Deimos Predator']
    quantity_wanted: 2
    msrp: 70
    hard_threshold: 52
    percent_off_threshold: 25
    minimum_savings: 15
  - id: mkiv-tactical
    name: MKIV Tactical Squad
    aliases: [Mk IV Marines, MK4 Marines, Mark IV Tactical Squad]
    queries:
      ['MKIV Tactical Squad Horus Heresy', 'Mark IV Marines Horus Heresy']
    quantity_wanted: 3
    expected_models: 20
    msrp: 85
    hard_threshold: 64
    percent_off_threshold: 25
    minimum_savings: 15
  - id: melee-weapons
    name: Horus Heresy Melee Weapons Upgrade Set
    aliases: [Melee Weapons Upgrade Set]
    queries: ['Horus Heresy Melee Weapons Upgrade Set']
    quantity_wanted: 2
    msrp: 47
    hard_threshold: 35
    percent_off_threshold: 25
    minimum_savings: 10
  - id: special-weapons
    name: Horus Heresy Special Weapons Upgrade Set
    aliases: [Special Weapons Upgrade Set]
    queries: ['Horus Heresy Special Weapons Upgrade Set']
    quantity_wanted: 1
    msrp: 47
    hard_threshold: 35
    percent_off_threshold: 25
    minimum_savings: 10
  - id: heavy-weapons-lascannons
